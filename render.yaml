# Publicar la API y la base de datos en Render (https://render.com).
#
# Render lee este archivo y arma los dos servicios solo. Lo unico que hay que
# hacer a mano es crear la cuenta y conectar el repositorio.
#
# Cuando termine, Render da una direccion parecida a
#   https://ticketflow-api.onrender.com
# Esa direccion se escribe en frontend/js/configuracion.js y la pagina de
# GitHub Pages queda hablando con la base de datos.

databases:
  - name: ticketflow-bd
    databaseName: ticketflow
    user: ticketflow
    plan: free

services:
  - type: web
    name: ticketflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: PUERTO
        value: 10000
      - key: BD_URL
        fromDatabase:
          name: ticketflow-bd
          property: connectionString
      - key: JWT_SECRETO
        generateValue: true
      - key: JWT_HORAS
        value: 8
      - key: ORIGEN_PERMITIDO
        value: https://eder114.github.io
