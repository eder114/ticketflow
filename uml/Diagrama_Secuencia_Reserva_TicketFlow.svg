<text x="295.0" y="382.0" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">3. confirmar la reserva</text>
<line x1="456" y1="450" x2="780" y2="450" stroke="#111827" stroke-width="2" marker-end="url(#cerrada)"/>
<text x="620.0" y="440.0" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">4. reservar(codigoEvento, numeroEntradas)</text>
