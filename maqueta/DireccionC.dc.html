<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    a { color: #4238C9; text-decoration: none; }
    a:hover { color: #635BFF; }
  </style>
</helmet>

<!-- DIRECCIÓN C · Compacta
     Una sola columna centrada. Sin panel lateral, así no hay mitad de
     pantalla que llenar. La foto es una franja delgada dentro de la
     tarjeta. Es la que menos espacio vacío deja de las tres. -->

<div style="width: 1440px; height: 900px; background: #F8FAFC; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;">

  <div style="width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
      <div style="width: 34px; height: 34px; border-radius: 9px; background: {{acento}}; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3l9 9-9 9-9-9 9-9z" fill="#ffffff"/></svg>
      </div>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px; letter-spacing: -0.02em; color: #111827;">TicketFlow</span>
    </div>

    <div style="background: #ffffff; border-radius: 20px; border: 1px solid #EEF2F7; box-shadow: 0 12px 32px rgba(17,24,39,0.10); overflow: hidden;">

      <div style="position: relative; height: 148px;">
        <img src="festival-noche.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,24,39,0.35) 0%, rgba(17,24,39,0.80) 100%);"></div>
        <div style="position: absolute; left: 28px; bottom: 20px;">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #A8A3FF;">2.845 eventos activos</span>
          <h1 style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.14; letter-spacing: -0.02em; color: #ffffff; margin: 6px 0 0;">Bienvenido de nuevo</h1>
        </div>
      </div>

      <div style="padding: 28px; display: flex; flex-direction: column; gap: 16px;">

        <div style="display: flex; flex-direction: column; gap: 7px;">
          <label style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #64748B;">Correo electrónico</label>
          <div style="padding: 15px 16px; border-radius: 10px; border: 1px solid #E2E8F0; background: #ffffff; font-size: 16px; color: #94A3B8;">nombre@correo.com</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 7px;">
          <label style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #64748B;">Contraseña</label>
          <div style="padding: 15px 16px; border-radius: 10px; border: 1px solid #E2E8F0; background: #ffffff; font-size: 16px; color: #94A3B8;">Tu contraseña</div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #64748B;">
            <div style="width: 15px; height: 15px; border: 1px solid #CBD5E1; border-radius: 3px;"></div>
            Mantener la sesión abierta
          </div>
          <span style="font-size: 14px; font-weight: 600; color: {{acento}};">¿Olvidaste tu contraseña?</span>
        </div>

        <div style="padding: 16px 28px; border-radius: 10px; background: {{acento}}; color: #ffffff; font-size: 16px; font-weight: 600; text-align: center; margin-top: 2px;">Iniciar sesión</div>

        <div style="display: flex; align-items: center; gap: 12px; margin-top: 2px;">
          <div style="flex-grow: 1; height: 1px; background: #EEF2F7;"></div>
          <span style="font-size: 12px; color: #94A3B8;">o</span>
          <div style="flex-grow: 1; height: 1px; background: #EEF2F7;"></div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
          <div style="padding: 13px 16px; border-radius: 10px; border: 1px solid #E2E8F0; background: #ffffff; font-size: 14.5px; font-weight: 600; color: #111827; text-align: center;">Soy cliente</div>
          <div style="padding: 13px 16px; border-radius: 10px; border: 1px solid #E2E8F0; background: #ffffff; font-size: 14.5px; font-weight: 600; color: #111827; text-align: center;">Soy organizador</div>
        </div>

      </div>
    </div>

    <p style="text-align: center; font-size: 14px; color: #94A3B8; margin: 0;">Proyecto Integrador · UCEVA · Tuluá, Valle del Cauca</p>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"acento":{"editor":"color","default":"#635BFF","options":["#635BFF","#0EA5E9","#E11D48","#0F766E"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { acento: this.props.acento ?? '#635BFF' };
  }
}
</script>
</body>
</html>
